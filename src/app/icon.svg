<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111929" />
      <stop offset="100%" stop-color="#1B2A4A" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5E298" />
      <stop offset="50%" stop-color="#C9A44C" />
      <stop offset="100%" stop-color="#A67C1E" />
    </linearGradient>
  </defs>

  <!-- Background Badge with rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect x="16" y="16" width="480" height="480" rx="98" fill="none" stroke="url(#goldGrad)" stroke-width="8" stroke-opacity="0.35"/>

  <!-- Scale / Balança da Justiça -->
  <g stroke="url(#goldGrad)" fill="url(#goldGrad)">
    <!-- Top Apex -->
    <polygon points="256,66 266,82 246,82" stroke-linejoin="round" stroke-width="3"/>
    <circle cx="256" cy="94" r="14" stroke-width="4"/>

    <!-- Main central vertical beam -->
    <line x1="256" y1="102" x2="256" y2="406" stroke-width="22" stroke-linecap="round"/>

    <!-- Central decorative pivot ring -->
    <circle cx="256" cy="148" r="22" fill="#1B2A4A" stroke-width="12"/>

    <!-- Horizontal beam with slight arch -->
    <path d="M96 156 Q256 128 416 156" fill="none" stroke-width="20" stroke-linecap="round"/>
    <circle cx="96" cy="156" r="11" stroke-width="2"/>
    <circle cx="416" cy="156" r="11" stroke-width="2"/>

    <!-- Left pan cords -->
    <line x1="96" y1="156" x2="52" y2="270" stroke-width="8" stroke-linecap="round"/>
    <line x1="96" y1="156" x2="140" y2="270" stroke-width="8" stroke-linecap="round"/>
    
    <!-- Left pan bowl -->
    <path d="M40 270 Q96 324 152 270 Z" stroke-width="6" stroke-linejoin="round"/>

    <!-- Right pan cords -->
    <line x1="416" y1="156" x2="372" y2="270" stroke-width="8" stroke-linecap="round"/>
    <line x1="416" y1="156" x2="460" y2="270" stroke-width="8" stroke-linecap="round"/>

    <!-- Right pan bowl -->
    <path d="M360 270 Q416 324 472 270 Z" stroke-width="6" stroke-linejoin="round"/>

    <!-- Base / Pedestal -->
    <rect x="206" y="382" width="100" height="24" rx="6" stroke-width="6"/>
    <ellipse cx="256" cy="416" rx="92" ry="18" stroke-width="6"/>
  </g>
</svg>